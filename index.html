<!doctype html>
<html lang="fr" class="no-js">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Noah Guglielmino — réseau, cloud et dev</title>
    <meta name="description" content="Portfolio de Noah Guglielmino, étudiant en BUT Réseaux &amp; Télécoms parcours DevCloud, en alternance : projets, compétences et contact, présentés comme une salle serveur.">
    <meta name="theme-color" content="#06080a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
    <meta name="color-scheme" content="dark light">
    <meta property="og:title" content="Noah Guglielmino">
    <meta property="og:description" content="Un portfolio présenté comme une salle serveur : baies, câbles de brassage et poste de supervision.">
    <meta property="og:type" content="website">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <!-- Décidé avant le premier rendu (aucun saut de mise en page) : JS actif, animations, préchargement. -->
    <script>
      (function (d, w) {
        var h = d.documentElement;
        h.className = 'js';
        try { if (w.localStorage.getItem('dc01-motion') === 'off') h.classList.add('motion-off'); } catch (e) {}
        if (w.matchMedia && w.matchMedia('(prefers-reduced-motion: reduce)').matches) { h.classList.add('rm'); return; }
        h.classList.add('intro');
        try { if (!w.sessionStorage.getItem('dc01-post')) { w.sessionStorage.setItem('dc01-post', '1'); h.classList.add('post'); } } catch (e) {}
      })(document, window);
    </script>
    <!--SITE-HEAD-->
  </head>
  <body class="site">
    <!--SITE-->
    <script type="module" src="./src/site/boot.ts"></script>
  </body>
</html>
